<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | Acurate Mind</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <style>
        body {
            background: radial-gradient(circle at top, #1e0b3b 0%, #050505 50%, #000000 100%);
            background-color: #000; color: #ffffff;
        }
    </style>
</head>
<body class="min-h-screen font-sans flex flex-col items-center justify-center p-6 relative">
    
    <div class="fixed inset-0 z-0 pointer-events-none">
        <div class="absolute top-[10%] left-[20%] w-96 h-96 bg-purple-600/10 rounded-full blur-[120px]"></div>
    </div>

    <main class="w-full max-w-md bg-[#1a1d2d]/80 backdrop-blur-xl rounded-2xl border border-white/10 p-8 relative z-10 shadow-2xl">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold text-white tracking-tight">Edit Profile</h1>
            <button onclick="window.history.back()" class="text-slate-400 hover:text-white text-sm transition-colors">Back</button>
        </div>

        <!-- Avatar Preview -->
        <div class="flex flex-col items-center mb-8">
            <div class="w-24 h-24 rounded-full bg-gradient-to-r from-purple-500 to-cyan-500 p-1 mb-4 shadow-[0_0_20px_rgba(168,85,247,0.3)]">
                <div class="w-full h-full bg-black rounded-full overflow-hidden border-2 border-black flex items-center justify-center">
                    <img id="profileImagePreview" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Acurate" alt="Profile" class="w-full h-full object-cover">
                </div>
            </div>
        </div>

        <!-- Upload Form -->
        <form id="profilePicForm" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Update Profile Picture</label>
                <input type="file" id="profilePicInput" accept="image/*" required
                    class="block w-full text-sm text-slate-400
                    file:mr-4 file:py-2.5 file:px-4
                    file:rounded-lg file:border-0
                    file:text-sm file:font-semibold
                    file:bg-cyan-500/10 file:text-cyan-400
                    hover:file:bg-cyan-500/20 file:transition-colors cursor-pointer border border-slate-700 rounded-lg bg-black/40">
            </div>

            <button type="submit" id="uploadBtn" class="w-full bg-gradient-to-r from-cyan-500 to-blue-500 text-white font-bold rounded-lg px-4 py-3 hover:shadow-[0_0_20px_rgba(34,211,238,0.4)] transition-all">
                Upload to Cloudinary
            </button>
        </form>
        
        <!-- Status Indicator -->
        <p id="uploadStatus" class="mt-4 text-center text-sm font-medium text-cyan-400 hidden"></p>
    </main>

    <!-- Vanilla JS Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('profilePicForm');
            const input = document.getElementById('profilePicInput');
            const status = document.getElementById('uploadStatus');
            const preview = document.getElementById('profileImagePreview');
            const btn = document.getElementById('uploadBtn');

            // 1. Instantly preview the selected image before uploading
            input.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    preview.src = URL.createObjectURL(file);
                }
            });

            // 2. Submit raw FormData to FastAPI
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const userId = localStorage.getItem('user_id');
                if (!userId) {
                    alert('Session expired. Please log in again.');
                    window.location.href = 'auth.html';
                    return;
                }

                const file = input.files[0];
                const formData = new FormData();
                formData.append("file", file); // Must match the "file" argument in FastAPI

                btn.innerText = "Uploading...";
                btn.disabled = true;
                status.classList.remove('hidden');
                status.innerText = "Connecting to Cloudinary...";
                status.className = "mt-4 text-center text-sm font-medium text-slate-400";

                try {
                    const response = await fetch(`/upload_profile_picture/${userId}`, { method: 'POST', body: formData });
                    const data = await response.json();
                    
                    if (response.ok) {
                        status.innerText = "Successfully updated!";
                        status.className = "mt-4 text-center text-sm font-medium text-green-400";
                        preview.src = data.secure_url;
                        localStorage.setItem('profile_picture_url', data.secure_url); // Useful for updating navigation bars globally
                    } else throw new Error(data.detail || "Unknown error");
                } catch (error) {
                    status.innerText = "Upload failed: " + error.message;
                    status.className = "mt-4 text-center text-sm font-medium text-red-400";
                } finally {
                    btn.innerText = "Upload to Cloudinary";
                    btn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
