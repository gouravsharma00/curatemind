<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Catalog | Acurate Mind</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body {
            background: radial-gradient(circle at top, #1e0b3b 0%, #050505 50%, #000000 100%);
            background-color: #000;
            color: #ffffff;
        }
        .bg-grid {
            background-image: linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col relative font-sans selection:bg-purple-500/30 selection:text-white">

    <!-- Ambient Background -->
    <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
        <div class="absolute top-[10%] left-[20%] w-96 h-96 bg-purple-600/10 rounded-full blur-[120px]"></div>
        <div class="absolute inset-0 bg-grid z-0"></div>
    </div>

    <!-- Navigation Bar -->
    <header class="relative z-20 w-full border-b border-white/5 bg-black/20 backdrop-blur-md">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex-shrink-0 flex items-center">
                <a href="index.html" class="text-2xl font-extrabold tracking-tight text-white flex items-center gap-2">
                    <span class="w-8 h-8 rounded-lg bg-gradient-to-br from-teal-400 to-blue-500 flex items-center justify-center shadow-lg shadow-teal-500/20">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.9 1.2 1.5 1.5 2.5"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 18h6"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 22h4"/></svg>
                    </span>
                    Acurate Mind
                </a>
            </div>
            <div class="hidden md:flex flex-1 justify-center">
                <a href="catalog.html" class="text-sm font-medium text-white drop-shadow-md">Courses</a>
            </div>
            <div class="flex items-center gap-4 sm:gap-6">
                <a href="dashboard.html" class="text-sm font-medium text-gray-300 hover:text-white transition-colors">Dashboard</a>
                <a href="profile.html" class="hidden sm:block text-sm font-medium text-gray-300 hover:text-white transition-colors">Profile</a>
                <button onclick="logoutUser()" class="text-sm font-medium text-gray-400 hover:text-white transition-colors flex items-center gap-2 border-l border-white/10 pl-4 sm:pl-6 ml-1 sm:ml-2">
                    Log out
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                </button>
            </div>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main class="relative z-10 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-1">
        
        <!-- Header Section -->
        <div class="text-center mb-12">
            <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight text-white mb-4">
                Explore Our <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">Course Catalog</span>
            </h1>
            <p class="text-gray-400 text-lg max-w-2xl mx-auto">Find the right path to elevate your skills, curated by AI and taught by industry experts.</p>
        </div>

        <!-- Search and Filter Panels -->
        <div class="flex flex-col md:flex-row gap-4 mb-10">
            <!-- Search -->
            <div class="flex-1 relative">
                <svg class="absolute left-4 top-3.5 w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="text" id="search-input" placeholder="Search courses, topics, or mentors..." class="w-full bg-[#1a1d2d] border border-slate-700/50 rounded-xl pl-12 pr-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-cyan-500/50 focus:ring-1 focus:ring-cyan-500/50 transition-all">
            </div>
            <!-- Filters -->
            <div class="flex gap-2 overflow-x-auto pb-2 md:pb-0 scrollbar-hide">
                <button data-topic="all" class="category-btn whitespace-nowrap px-5 py-3 rounded-xl bg-gradient-to-r from-cyan-500/20 to-blue-500/20 border border-cyan-500/30 text-cyan-300 font-medium">All Courses</button>
                <button data-topic="machine learning" class="category-btn whitespace-nowrap px-5 py-3 rounded-xl bg-[#1a1d2d] border border-slate-700/50 text-gray-400 hover:text-white hover:border-slate-500 transition-colors">Machine Learning</button>
                <button data-topic="data science" class="category-btn whitespace-nowrap px-5 py-3 rounded-xl bg-[#1a1d2d] border border-slate-700/50 text-gray-400 hover:text-white hover:border-slate-500 transition-colors">Data Science</button>
                <button data-topic="web dev" class="category-btn whitespace-nowrap px-5 py-3 rounded-xl bg-[#1a1d2d] border border-slate-700/50 text-gray-400 hover:text-white hover:border-slate-500 transition-colors">Web Dev</button>
                <button data-topic="cybersecurity" class="category-btn whitespace-nowrap px-5 py-3 rounded-xl bg-[#1a1d2d] border border-slate-700/50 text-gray-400 hover:text-white hover:border-slate-500 transition-colors">Cybersecurity</button>
            </div>
        </div>

        <!-- Course Grid -->
        <div id="courses-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-16">
            <!-- Dynamically injected catalog courses will appear here -->
        </div>
    </main>

    <!-- Footer Section -->
    <footer class="relative z-10 w-full border-t border-white/10 bg-[#050505] py-8 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-2 text-xl font-extrabold text-white opacity-80">
                <span class="w-6 h-6 rounded-md bg-gradient-to-br from-teal-400 to-blue-500 flex items-center justify-center">
                    <svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.9 1.2 1.5 1.5 2.5"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 18h6"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 22h4"/></svg>
                </span>
                Acurate Mind
            </div>
            <div class="flex gap-6 text-sm text-gray-500">
                <a href="#" class="hover:text-cyan-400 transition-colors">Privacy</a>
                <a href="#" class="hover:text-cyan-400 transition-colors">Terms</a>
                <a href="#" class="hover:text-cyan-400 transition-colors">Support</a>
            </div>
            <p class="text-slate-600 text-sm">© 2026 Acurate Mind. All rights reserved.</p>
        </div>
    </footer>

    <!-- Dynamic Rendering & Filtering Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('search-input');
            const categoryBtns = document.querySelectorAll('.category-btn');
            const coursesGrid = document.getElementById('courses-grid');

            let currentTopic = '';
            let currentSearch = '';

            // 1. Fetch data from our FastAPI endpoint
            async function fetchCourses() {
                try {
                    let url = '/courses?';
                    if (currentTopic && currentTopic !== 'all') {
                        url += `topic=${encodeURIComponent(currentTopic)}&`;
                    }
                    if (currentSearch) {
                        url += `search=${encodeURIComponent(currentSearch)}`;
                    }

                    const response = await fetch(url);
                    if (response.ok) {
                        const courses = await response.json();
                        renderCourses(courses);
                    } else {
                        coursesGrid.innerHTML = '<p class="text-red-400 col-span-3 text-center">Failed to load courses.</p>';
                    }
                } catch (error) {
                    coursesGrid.innerHTML = '<p class="text-red-400 col-span-3 text-center">Network error. Make sure your FastAPI server is running.</p>';
                }
            }

            // 2. Render the Course Cards to the DOM
            function renderCourses(courses) {
                coursesGrid.innerHTML = '';
                
                if (courses.length === 0) {
                    coursesGrid.innerHTML = '<p class="text-gray-400 col-span-3 text-center mt-10">No courses found matching your criteria.</p>';
                    return;
                }

                courses.forEach(course => {
                    // Dynamic UI Styling based on course Level
                    let badgeColor = 'border-cyan-500/30 text-cyan-400 bg-cyan-500/10';
                    let hoverColor = 'hover:border-cyan-500/50 hover:shadow-[0_0_20px_rgba(34,211,238,0.15)] group-hover:text-cyan-300';
                    let bgGradient = 'from-slate-800 to-slate-900';
                    let iconColor = 'text-cyan-400/50';

                    if (course.level === 'Intermediate') {
                        badgeColor = 'border-purple-500/30 text-purple-400 bg-purple-500/10';
                        hoverColor = 'hover:border-purple-500/50 hover:shadow-[0_0_20px_rgba(168,85,247,0.15)] group-hover:text-purple-300';
                        bgGradient = 'from-purple-900/50 to-indigo-900/50';
                        iconColor = 'text-purple-400/50';
                    } else if (course.level === 'Advanced') {
                        badgeColor = 'border-pink-500/30 text-pink-400 bg-pink-500/10';
                        hoverColor = 'hover:border-pink-500/50 hover:shadow-[0_0_20px_rgba(236,72,153,0.15)] group-hover:text-pink-300';
                        bgGradient = 'from-pink-900/50 to-rose-900/50';
                        iconColor = 'text-pink-400/50';
                    }

                    // Fallbacks just in case data is missing
                    const duration = course.duration || '4 Weeks';
                    const instructor = course.instructor || 'Curatemind Staff';

                    const cardHTML = `
                    <div class="bg-[#1a1d2d] rounded-2xl border border-slate-700/50 transition-all flex flex-col h-full overflow-hidden group cursor-pointer ${hoverColor}">
                        <div class="h-40 bg-gradient-to-br ${bgGradient} relative">
                            <div class="absolute inset-0 opacity-40 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4IiBoZWlnaHQ9IjgiPgo8cmVjdCB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBmaWxsPSIjZmZmIiBmaWxsLW9wYWNpdHk9IjAuMDUiLz4KPC9zdmc+')]"></div>
                            <div class="absolute inset-0 flex items-center justify-center">
                                <svg class="w-12 h-12 ${iconColor} group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                            </div>
                        </div>
                        <div class="p-6 flex flex-col flex-grow">
                            <div class="flex justify-between items-center mb-3">
                                <span class="text-xs font-semibold border px-2.5 py-1 rounded-full ${badgeColor}">${course.level}</span>
                                <span class="text-xs text-gray-500 flex items-center gap-1"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> ${duration}</span>
                            </div>
                            <h3 class="font-bold text-xl mb-2 text-white transition-colors">${course.title}</h3>
                            <p class="text-gray-400 text-sm mb-6 flex-grow">${course.description}</p>
                            <div class="flex items-center justify-between border-t border-slate-700/50 pt-4">
                                <div class="flex items-center gap-2">
                                    <!-- Use DiceBear API to generate a unique random avatar based on the instructor's name -->
                                    <div class="w-6 h-6 rounded-full bg-gradient-to-r from-blue-400 to-cyan-500 overflow-hidden"><img src="https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(instructor)}" alt="Mentor"></div>
                                    <span class="text-xs text-gray-300">${instructor}</span>
                                </div>
                                <span class="text-cyan-400 text-sm font-semibold">Start</span>
                            </div>
                        </div>
                    </div>
                    `;
                    coursesGrid.innerHTML += cardHTML;
                });
            }

            // 3. Real-Time Search Listener (with a small 300ms debounce to prevent spamming the API)
            let searchTimeout;
            searchInput.addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    currentSearch = e.target.value.trim();
                    fetchCourses();
                }, 300); 
            });

            // 4. Category Filter Buttons Listener
            categoryBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    // Remove active styles from all buttons
                    categoryBtns.forEach(b => {
                        b.classList.remove('bg-gradient-to-r', 'from-cyan-500/20', 'to-blue-500/20', 'border-cyan-500/30', 'text-cyan-300');
                        b.classList.add('bg-[#1a1d2d]', 'border-slate-700/50', 'text-gray-400');
                    });

                    // Add active styles to the clicked button
                    const clickedBtn = e.currentTarget;
                    clickedBtn.classList.remove('bg-[#1a1d2d]', 'border-slate-700/50', 'text-gray-400');
                    clickedBtn.classList.add('bg-gradient-to-r', 'from-cyan-500/20', 'to-blue-500/20', 'border-cyan-500/30', 'text-cyan-300');

                    // Extract the topic value and re-fetch
                    currentTopic = clickedBtn.getAttribute('data-topic');
                    fetchCourses();
                });
            });

            // Initialize the page by loading all courses
            fetchCourses();
        });

        // Reusable Logout Function
        function logoutUser() {
            localStorage.clear();
            window.location.href = 'auth.html';
        }
    </script>
</body>
</html>
