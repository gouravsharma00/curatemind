<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onboarding | Curatemind</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-4 sm:p-6 font-sans text-slate-200">

    <!-- Page-Level Back Button -->
    <div class="w-full max-w-xl mb-4">
        <button id="back-button" class="inline-flex items-center gap-2 text-sm font-medium text-slate-400 hover:text-white transition-colors cursor-pointer group focus:outline-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 group-hover:-translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Back
        </button>
    </div>

    <!-- Main Onboarding Card -->
    <main class="w-full max-w-xl bg-slate-900 rounded-2xl shadow-[0_8px_32px_rgba(0,0,0,0.5)] border border-slate-800 p-8 sm:p-10 flex flex-col min-h-[500px]">
        
        <!-- Step Content Container -->
        <div class="flex-grow">
            
            <!-- Step 1: Goals -->
            <div id="step-1" class="step-container">
                <div class="mb-8">
                    <h1 class="text-3xl font-bold mb-2 text-white">What are your goals?</h1>
                    <p class="text-slate-400">Pick anything that fits.</p>
                </div>
                
                <div class="space-y-3">
                    <button class="option-card w-full flex items-center gap-4 p-4 rounded-xl border border-slate-700 bg-slate-800/50 hover:border-cyan-500 transition-colors text-left group">
                        <div class="w-5 h-5 rounded-full border-2 border-slate-600 flex items-center justify-center flex-shrink-0 group-[.selected]:border-cyan-500">
                            <div class="w-2.5 h-2.5 rounded-full bg-cyan-500 hidden inner-dot"></div>
                        </div>
                        <span class="font-medium text-slate-200 group-[.selected]:text-cyan-400">Land a tech job</span>
                    </button>
                    <button class="option-card w-full flex items-center gap-4 p-4 rounded-xl border border-slate-700 bg-slate-800/50 hover:border-cyan-500 transition-colors text-left group">
                        <div class="w-5 h-5 rounded-full border-2 border-slate-600 flex items-center justify-center flex-shrink-0 group-[.selected]:border-cyan-500">
                            <div class="w-2.5 h-2.5 rounded-full bg-cyan-500 hidden inner-dot"></div>
                        </div>
                        <span class="font-medium text-slate-200 group-[.selected]:text-cyan-400">Build a side project</span>
                    </button>
                    <button class="option-card w-full flex items-center gap-4 p-4 rounded-xl border border-slate-700 bg-slate-800/50 hover:border-cyan-500 transition-colors text-left group">
                        <div class="w-5 h-5 rounded-full border-2 border-slate-600 flex items-center justify-center flex-shrink-0 group-[.selected]:border-cyan-500">
                            <div class="w-2.5 h-2.5 rounded-full bg-cyan-500 hidden inner-dot"></div>
                        </div>
                        <span class="font-medium text-slate-200 group-[.selected]:text-cyan-400">Career switch</span>
                    </button>
                    <button class="option-card w-full flex items-center gap-4 p-4 rounded-xl border border-slate-700 bg-slate-800/50 hover:border-cyan-500 transition-colors text-left group">
                        <div class="w-5 h-5 rounded-full border-2 border-slate-600 flex items-center justify-center flex-shrink-0 group-[.selected]:border-cyan-500">
                            <div class="w-2.5 h-2.5 rounded-full bg-cyan-500 hidden inner-dot"></div>
                        </div>
                        <span class="font-medium text-slate-200 group-[.selected]:text-cyan-400">Academic study</span>
                    </button>
                    <button class="option-card w-full flex items-center gap-4 p-4 rounded-xl border border-slate-700 bg-slate-800/50 hover:border-cyan-500 transition-colors text-left group">
                        <div class="w-5 h-5 rounded-full border-2 border-slate-600 flex items-center justify-center flex-shrink-0 group-[.selected]:border-cyan-500">
                            <div class="w-2.5 h-2.5 rounded-full bg-cyan-500 hidden inner-dot"></div>
                        </div>
                        <span class="font-medium text-slate-200 group-[.selected]:text-cyan-400">Personal curiosity</span>
                    </button>
                </div>
            </div>

            <!-- Step 2: Interests -->
            <div id="step-2" class="step-container hidden">
                <div class="mb-8">
                    <h1 class="text-3xl font-bold mb-2 text-white">Pick your interests</h1>
                    <p class="text-slate-400">Select at least 2 — drives content matching.</p>
                </div>
                
                <div class="flex flex-wrap gap-3">
                    <!-- Pill Items -->
                    <button class="option-pill px-5 py-2.5 rounded-full border border-slate-700 bg-slate-800/50 text-slate-300 font-medium hover:border-cyan-500 hover:bg-slate-800 transition-colors group">
                        python
                    </button>
                    <button class="option-pill px-5 py-2.5 rounded-full border border-slate-700 bg-slate-800/50 text-slate-300 font-medium hover:border-cyan-500 hover:bg-slate-800 transition-colors group">
                        javascript
                    </button>
                    <button class="option-pill px-5 py-2.5 rounded-full border border-slate-700 bg-slate-800/50 text-slate-300 font-medium hover:border-cyan-500 hover:bg-slate-800 transition-colors group">
                        react
                    </button>
                    <button class="option-pill px-5 py-2.5 rounded-full border border-slate-700 bg-slate-800/50 text-slate-300 font-medium hover:border-cyan-500 hover:bg-slate-800 transition-colors group">
                        ml
                    </button>
                    <button class="option-pill px-5 py-2.5 rounded-full border border-slate-700 bg-slate-800/50 text-slate-300 font-medium hover:border-cyan-500 hover:bg-slate-800 transition-colors group">
                        data-science
                    </button>
                    <button class="option-pill px-5 py-2.5 rounded-full border border-slate-700 bg-slate-800/50 text-slate-300 font-medium hover:border-cyan-500 hover:bg-slate-800 transition-colors group">
                        statistics
                    </button>
                    <button class="option-pill px-5 py-2.5 rounded-full border border-slate-700 bg-slate-800/50 text-slate-300 font-medium hover:border-cyan-500 hover:bg-slate-800 transition-colors group">
                        backend
                    </button>
                    <button class="option-pill px-5 py-2.5 rounded-full border border-slate-700 bg-slate-800/50 text-slate-300 font-medium hover:border-cyan-500 hover:bg-slate-800 transition-colors group">
                        frontend
                    </button>
                    <button class="option-pill px-5 py-2.5 rounded-full border border-slate-700 bg-slate-800/50 text-slate-300 font-medium hover:border-cyan-500 hover:bg-slate-800 transition-colors group">
                        sql
                    </button>
                    <button class="option-pill px-5 py-2.5 rounded-full border border-slate-700 bg-slate-800/50 text-slate-300 font-medium hover:border-cyan-500 hover:bg-slate-800 transition-colors group">
                        deep-learning
                    </button>
                    <button class="option-pill px-5 py-2.5 rounded-full border border-slate-700 bg-slate-800/50 text-slate-300 font-medium hover:border-cyan-500 hover:bg-slate-800 transition-colors group">
                        devops
                    </button>
                    <button class="option-pill px-5 py-2.5 rounded-full border border-slate-700 bg-slate-800/50 text-slate-300 font-medium hover:border-cyan-500 hover:bg-slate-800 transition-colors group">
                        mlops
                    </button>
                    <button class="option-pill px-5 py-2.5 rounded-full border border-slate-700 bg-slate-800/50 text-slate-300 font-medium hover:border-cyan-500 hover:bg-slate-800 transition-colors group">
                        systems
                    </button>
                </div>
            </div>

            <!-- Step 3: Learning Style -->
            <div id="step-3" class="step-container hidden">
                <div class="mb-8">
                    <h1 class="text-3xl font-bold mb-2 text-white">How do you learn best?</h1>
                    <p class="text-slate-400">Pick your preferred content formats.</p>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <button class="option-card flex flex-col items-start gap-4 p-5 rounded-xl border border-slate-700 bg-slate-800/50 hover:border-cyan-500 transition-colors text-left group">
                        <div class="w-5 h-5 rounded-full border-2 border-slate-600 flex items-center justify-center group-[.selected]:border-cyan-500">
                            <div class="w-2.5 h-2.5 rounded-full bg-cyan-500 hidden inner-dot"></div>
                        </div>
                        <span class="font-medium text-slate-200 group-[.selected]:text-cyan-400">Video</span>
                    </button>
                    <button class="option-card flex flex-col items-start gap-4 p-5 rounded-xl border border-slate-700 bg-slate-800/50 hover:border-cyan-500 transition-colors text-left group">
                        <div class="w-5 h-5 rounded-full border-2 border-slate-600 flex items-center justify-center group-[.selected]:border-cyan-500">
                            <div class="w-2.5 h-2.5 rounded-full bg-cyan-500 hidden inner-dot"></div>
                        </div>
                        <span class="font-medium text-slate-200 group-[.selected]:text-cyan-400">Article</span>
                    </button>
                    <button class="option-card flex flex-col items-start gap-4 p-5 rounded-xl border border-slate-700 bg-slate-800/50 hover:border-cyan-500 transition-colors text-left group">
                        <div class="w-5 h-5 rounded-full border-2 border-slate-600 flex items-center justify-center group-[.selected]:border-cyan-500">
                            <div class="w-2.5 h-2.5 rounded-full bg-cyan-500 hidden inner-dot"></div>
                        </div>
                        <span class="font-medium text-slate-200 group-[.selected]:text-cyan-400">Interactive</span>
                    </button>
                    <button class="option-card flex flex-col items-start gap-4 p-5 rounded-xl border border-slate-700 bg-slate-800/50 hover:border-cyan-500 transition-colors text-left group">
                        <div class="w-5 h-5 rounded-full border-2 border-slate-600 flex items-center justify-center group-[.selected]:border-cyan-500">
                            <div class="w-2.5 h-2.5 rounded-full bg-cyan-500 hidden inner-dot"></div>
                        </div>
                        <span class="font-medium text-slate-200 group-[.selected]:text-cyan-400">Project</span>
                    </button>
                </div>
            </div>

        </div>

        <!-- Bottom Navigation Bar -->
        <div class="mt-10 pt-6 border-t border-slate-800 flex items-center justify-between">
            <button id="btn-back" class="px-6 py-2.5 rounded-lg border border-slate-700 text-slate-400 font-medium hover:bg-slate-800 hover:text-white transition-colors hidden">
                Back
            </button>
            <!-- Added ml-auto so it aligns right when Back is hidden -->
            <button id="btn-continue" class="ml-auto px-6 py-2.5 rounded-lg bg-gradient-to-r from-cyan-500 to-purple-500 text-white border-none font-medium hover:shadow-[0_0_15px_rgba(6,182,212,0.4)] transition-all">
                Continue
            </button>
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // Global Page Back Button Logic
            const globalBackButton = document.getElementById('back-button');
            if (globalBackButton) {
                globalBackButton.addEventListener('click', () => {
                    if (window.history.length > 1) {
                        window.history.back();
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                });
            }
            
            // Step Navigation Logic
            let currentStep = 1;
            const totalSteps = 3;
            const btnBack = document.getElementById('btn-back');
            const btnContinue = document.getElementById('btn-continue');
            const steps = document.querySelectorAll('.step-container');

            function updateUI() {
                // Toggle step visibility
                steps.forEach((step, index) => {
                    if (index + 1 === currentStep) {
                        step.classList.remove('hidden');
                    } else {
                        step.classList.add('hidden');
                    }
                });

                // Update buttons
                if (currentStep === 1) {
                    btnBack.classList.add('hidden');
                } else {
                    btnBack.classList.remove('hidden');
                }

                if (currentStep === totalSteps) {
                    btnContinue.textContent = 'Go to Assessment';
                } else {
                    btnContinue.textContent = 'Continue';
                }
            }

            btnContinue.addEventListener('click', async () => {
                if (currentStep < totalSteps) {
                    currentStep++;
                    updateUI();
                } else {
                    // Grab user_id from previous login/registration
                    const userId = localStorage.getItem('user_id');
                    if (!userId) {
                        alert("Session expired. Please log in again.");
                        window.location.href = 'auth.html';
                        return;
                    }

                    // Extract chosen interest pills as a comma-separated string
                    const selectedPills = document.querySelectorAll('#step-2 .option-pill.selected');
                    const interestsArray = Array.from(selectedPills).map(pill => pill.textContent.trim());
                    
                    try {
                        const response = await fetch(`/update_profile/${userId}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ interests: interestsArray.join(','), tier: 'Beginner' })
                        });
                        
                        if (response.ok) {
                            window.location.href = 'assessment.html';
                        } else {
                            alert('Failed to save onboarding data.');
                        }
                    } catch (error) {
                        alert('Network error. Make sure the backend server is running.');
                    }
                }
            });

            btnBack.addEventListener('click', () => {
                if (currentStep > 1) {
                    currentStep--;
                    updateUI();
                }
            });

            // Selection Toggle Logic for Options (Cards and Pills)
            const optionCards = document.querySelectorAll('.option-card');
            const optionPills = document.querySelectorAll('.option-pill');

            // Logic for Cards (Goals & Learning Style)
            optionCards.forEach(card => {
                card.addEventListener('click', () => {
                    card.classList.toggle('selected');
                    card.classList.toggle('border-cyan-500');
                    card.classList.toggle('bg-cyan-900/20');
                    card.classList.toggle('border-slate-700');
                    
                    const dot = card.querySelector('.inner-dot');
                    if(dot) dot.classList.toggle('hidden');
                });
            });

            // Logic for Pills (Interests)
            optionPills.forEach(pill => {
                pill.addEventListener('click', () => {
                    pill.classList.toggle('selected');
                    pill.classList.toggle('border-cyan-500');
                    pill.classList.toggle('bg-cyan-900/20');
                    pill.classList.toggle('text-cyan-400');
                    pill.classList.toggle('border-slate-700');
                    pill.classList.toggle('text-slate-300');
                });
            });
            
        });
    </script>

</body>
</html>
