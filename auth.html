<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Curatemind | Authentication</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body {
            background: radial-gradient(circle at bottom right, #1e0b3b 0%, #050505 50%, #000000 100%);
            background-color: #000;
            color: #ffffff;
        }
    </style>
</head>
<body class="min-h-screen font-sans flex flex-col justify-center items-center relative overflow-hidden selection:bg-purple-500/30">

    <!-- Ambient Background Glow -->
    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-purple-600/20 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-cyan-600/10 rounded-full blur-[120px]"></div>
    </div>

    <main class="w-full max-w-md px-4 relative z-10">
        
        <!-- Logo & Branding -->
        <div class="text-center mb-8">
            <a href="#" class="inline-flex items-center gap-2 text-2xl font-extrabold tracking-tight text-white">
                <span class="w-8 h-8 rounded-lg bg-gradient-to-br from-cyan-400 to-blue-500 flex items-center justify-center shadow-lg shadow-cyan-500/20">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.9 1.2 1.5 1.5 2.5"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 18h6"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 22h4"/></svg>
                </span>
                Curatemind
            </a>
        </div>

        <!-- Glassmorphic Auth Card -->
        <div class="bg-white/5 backdrop-blur-xl rounded-2xl border border-white/10 shadow-[0_8px_32px_rgba(0,0,0,0.5)] p-8 relative">
            
            <!-- Sign In Form (Default Visible) -->
            <form id="signInForm">
                <div class="text-center mb-8">
                    <h1 class="text-2xl font-bold text-white tracking-tight mb-2">Welcome back</h1>
                    <p class="text-sm text-slate-400">Sign in to continue learning.</p>
                </div>

                <div class="space-y-5 mb-6">
                    <div>
                        <label for="signin-email" class="block text-sm font-medium text-gray-300 mb-1.5">Email address</label>
                        <input type="email" id="signin-email" name="email" required autocomplete="email"
                            class="w-full bg-black/40 text-white border border-white/10 rounded-lg px-4 py-3 focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition-all placeholder-gray-600" 
                            placeholder="name@example.com">
                    </div>
                    <div>
                        <label for="signin-password" class="block text-sm font-medium text-gray-300 mb-1.5">Password</label>
                        <input type="password" id="signin-password" name="password" required
                            class="w-full bg-black/40 text-white border border-white/10 rounded-lg px-4 py-3 focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition-all placeholder-gray-600" 
                            placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-cyan-400 to-purple-500 text-white font-bold rounded-lg px-4 py-3.5 hover:shadow-[0_0_20px_rgba(168,85,247,0.4)] transition-all transform hover:-translate-y-0.5 mb-6">
                    Sign in
                </button>

                <p class="text-center text-sm text-gray-400">
                    New to Curatemind? 
                    <button type="button" id="showSignUpBtn" class="text-cyan-400 font-semibold hover:text-cyan-300 transition-colors ml-1">Create an account</button>
                </p>
            </form>

            <!-- Sign Up Form (Default Hidden) -->
            <form id="signUpForm" class="hidden">
                <div class="text-center mb-8">
                    <h1 class="text-2xl font-bold text-white tracking-tight mb-2">Create your account</h1>
                    <p class="text-sm text-slate-400">Start your adaptive learning journey.</p>
                </div>

                <div class="space-y-5 mb-6">
                    <div>
                        <label for="signup-fullname" class="block text-sm font-medium text-gray-300 mb-1.5">Full Name</label>
                        <input type="text" id="signup-fullname" name="full_name" required
                            class="w-full bg-black/40 text-white border border-white/10 rounded-lg px-4 py-3 focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition-all placeholder-gray-600" 
                            placeholder="John Doe">
                    </div>
                    <div>
                        <label for="signup-email" class="block text-sm font-medium text-gray-300 mb-1.5">Email address</label>
                        <input type="email" id="signup-email" name="email" required autocomplete="email"
                            class="w-full bg-black/40 text-white border border-white/10 rounded-lg px-4 py-3 focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition-all placeholder-gray-600" 
                            placeholder="name@example.com">
                    </div>
                    <div>
                        <label for="signup-password" class="block text-sm font-medium text-gray-300 mb-1.5">Password</label>
                        <input type="password" id="signup-password" name="password" required minlength="6"
                            class="w-full bg-black/40 text-white border border-white/10 rounded-lg px-4 py-3 focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition-all placeholder-gray-600" 
                            placeholder="••••••••">
                    </div>
                    
                    <!-- Role Toggle -->
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1.5">I am a:</label>
                        <div class="flex gap-4">
                            <label class="flex-1 cursor-pointer">
                                <input type="radio" name="role_type" value="student" class="peer sr-only" checked>
                                <div class="text-center px-4 py-2.5 rounded-lg border border-white/10 bg-black/40 text-gray-400 peer-checked:border-cyan-500 peer-checked:text-cyan-400 transition-all font-medium">Student</div>
                            </label>
                            <label class="flex-1 cursor-pointer">
                                <input type="radio" name="role_type" value="teacher" class="peer sr-only">
                                <div class="text-center px-4 py-2.5 rounded-lg border border-white/10 bg-black/40 text-gray-400 peer-checked:border-purple-500 peer-checked:text-purple-400 transition-all font-medium">Teacher</div>
                            </label>
                        </div>
                    </div>

                    <!-- Dynamic Teacher Code Input -->
                    <div id="admin-code-container" class="hidden">
                        <label for="signup-admin-code" class="block text-sm font-medium text-gray-300 mb-1.5">Teacher Access Code</label>
                        <input type="password" id="signup-admin-code" name="admin_code"
                            class="w-full bg-black/40 text-white border border-white/10 rounded-lg px-4 py-3 focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition-all placeholder-gray-600" 
                            placeholder="Enter code (e.g. admin02)">
                    </div>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-cyan-400 to-purple-500 text-white font-bold rounded-lg px-4 py-3.5 hover:shadow-[0_0_20px_rgba(168,85,247,0.4)] transition-all transform hover:-translate-y-0.5 mb-6">
                    Create account
                </button>

                <p class="text-center text-sm text-gray-400">
                    Already have an account? 
                    <button type="button" id="showSignInBtn" class="text-cyan-400 font-semibold hover:text-cyan-300 transition-colors ml-1">Sign in</button>
                </p>
            </form>

        </div>
    </main>

    <!-- Vanilla JS Logic for LocalStorage Simulation -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const signInForm = document.getElementById('signInForm');
            const signUpForm = document.getElementById('signUpForm');
            const showSignUpBtn = document.getElementById('showSignUpBtn');
            const showSignInBtn = document.getElementById('showSignInBtn');

            // 1. Toggle Logic
            showSignUpBtn.addEventListener('click', (e) => {
                e.preventDefault();
                signInForm.classList.add('hidden');
                signUpForm.classList.remove('hidden');
            });

            showSignInBtn.addEventListener('click', (e) => {
                e.preventDefault();
                signUpForm.classList.add('hidden');
                signInForm.classList.remove('hidden');
            });

            // 1.5 Role Toggle Logic
            const roleRadios = document.querySelectorAll('input[name="role_type"]');
            const adminCodeContainer = document.getElementById('admin-code-container');
            const adminCodeInput = document.getElementById('signup-admin-code');
            
            roleRadios.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    if (e.target.value === 'teacher') {
                        adminCodeContainer.classList.remove('hidden');
                    } else {
                        adminCodeContainer.classList.add('hidden');
                        adminCodeInput.value = ''; // Reset code if switched back to student
                    }
                });
            });

            // 2. API Registration Logic
            signUpForm.addEventListener('submit', async (e) => {
                e.preventDefault(); 
                const full_name = document.getElementById('signup-fullname').value.trim();
                const email = document.getElementById('signup-email').value.trim();
                const password = document.getElementById('signup-password').value;
                const adminCode = document.getElementById('signup-admin-code').value.trim();
                
                // Explicitly map variables to Pydantic snake_case schema keys
                const payload = {
                    full_name: full_name,
                    email: email,
                    password: password,
                    admin_code: adminCode === "" ? null : adminCode
                };

                try {
                    const response = await fetch('/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        // Save the assigned user ID into local storage
                        localStorage.setItem('user_id', data.user_id);
                        localStorage.setItem('role', data.role);
                        
                        if (data.role === 'admin') {
                            window.location.href = 'admin_dashboard.html';
                        } else {
                            window.location.href = 'onboarding.html';
                        }
                    } else {
                        const errorData = await response.json();
                        alert('Registration failed: ' + (errorData.detail || 'Unknown error'));
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('Network error. Make sure the backend server is running.');
                }
            });

            // 3. API Login Logic
            signInForm.addEventListener('submit', async (e) => {
                e.preventDefault(); 
                const email = document.getElementById('signin-email').value.trim();
                const password = document.getElementById('signin-password').value;

                try {
                    const response = await fetch('http://127.0.0.1:8000/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        // Save the user ID into local storage
                        localStorage.setItem('user_id', data.user_id);
                        
                        // Also save access token in case you need it for future authenticated endpoints
                        localStorage.setItem('access_token', data.access_token);
                        localStorage.setItem('role', data.role);
                        
                        if (data.role === 'admin') {
                            window.location.href = 'admin_dashboard.html';
                        } else {
                            window.location.href = 'dashboard.html';
                        }
                    } else {
                        const errorData = await response.json();
                        alert('Login failed: ' + (errorData.detail || 'Invalid credentials'));
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('Network error. Make sure the backend server is running.');
                }
            });
        });
    </script>
</body>
</html>
